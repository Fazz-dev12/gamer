<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171326">
<title>Project Moonlight — Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100e1c;color:#f9f4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:flex;justify-content:center}.game{width:min(100%,720px);min-height:100dvh;padding:12px;display:flex;flex-direction:column;gap:10px}.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.12em;color:#d9c9fa}.scene{position:relative;height:min(54vh,390px);min-height:250px;border-radius:18px;overflow:hidden;border:1px solid #ffffff25;background:linear-gradient(#29264c 0%,#7a557e 56%,#ed9cba 57%,#3b2a50 100%)}.moon{position:absolute;right:12%;top:12%;width:55px;height:55px;border-radius:50%;background:#fff1d0;box-shadow:0 0 30px #fff1d077}.building{position:absolute;bottom:0;left:0;width:100%;height:48%;background:#211d38;clip-path:polygon(0 35%,10% 35%,10% 5%,23% 5%,23% 48%,35% 48%,35% 18%,48% 18%,48% 0,63% 0,63% 40%,76% 40%,76% 10%,90% 10%,90% 32%,100% 32%,100% 100%,0 100%)}.window{position:absolute;bottom:18%;left:15%;width:10px;height:20px;background:#ffcc8a;box-shadow:0 0 10px #ffcc8a;z-index:1}.figure{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:150px;height:205px}.body{position:absolute;bottom:-4px;left:12px;width:126px;height:112px;background:linear-gradient(120deg,#27213f,#4f3e70);border-radius:48% 48% 0 0}.hair{position:absolute;top:13px;left:31px;width:88px;height:91px;background:#29213a;border-radius:50% 50% 34% 34%;z-index:2}.face{position:absolute;top:37px;left:43px;width:66px;height:83px;background:#f5c5ba;border-radius:43% 43% 48% 48%;z-index:3}.bang{position:absolute;top:18px;left:34px;width:83px;height:54px;background:#29213a;clip-path:polygon(0 0,100% 0,94% 58%,72% 40%,61% 100%,46% 45%,28% 84%,18% 44%,3% 65%);z-index:4}.eye{position:absolute;top:73px;width:7px;height:10px;background:#30203e;border-radius:50%;z-index:5}.e1{left:59px}.e2{left:89px}.tag{position:absolute;top:10px;left:10px;background:#100e1caa;padding:6px 9px;border-radius:999px;font-size:10px;letter-spacing:.1em}.hotspot{position:absolute;z-index:6;border:2px solid #fff0a9;background:#ffeaa933;border-radius:10px;color:#fff;font-size:11px;padding:7px;box-shadow:0 0 12px #ffeaa966}.hotspot:focus,.hotspot:hover{background:#ffdf7955}.door{bottom:14%;right:8%}.desk{bottom:8%;left:7%}.panel{background:#211c35;border:1px solid #ffffff24;border-radius:16px;padding:15px}.speaker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#8be9fd;font-weight:800;margin-bottom:7px}.story{line-height:1.6;font-size:14px;min-height:68px}.choices{display:grid;gap:8px;margin-top:12px}button{font:inherit;color:#f9f4ff;background:#342a50;border:1px solid #ffffff25;border-radius:12px;padding:12px;text-align:left;cursor:pointer}button:active{transform:scale(.99)}button:hover{border-color:#ff8eb8}.choiceNo{color:#ff8eb8;font-weight:900;margin-right:8px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{font-size:12px;padding:8px 10px}.status{color:#c8bddc;font-size:11px;display:flex;justify-content:space-between;gap:8px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#080711d9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modalbox{width:min(100%,420px);background:#211c35;border:1px solid #ffffff35;border-radius:16px;padding:18px}.modalbox h2{margin:0 0 10px;font-size:18px}.modalbox p{line-height:1.6;font-size:14px}.modalbox button{margin-top:12px;width:100%;text-align:center}
@media(min-width:560px){.game{padding:20px}.scene{height:380px}.story{font-size:16px}}
</style>
</head>
<body>
<main class="game">
  <header class="bar"><strong>✦ PROJECT MOONLIGHT</strong><span id="chapter">PROLOG • 01</span></header>
  <section class="scene" aria-label="Latar ilustrasi malam">
    <div class="moon"></div><div class="building"></div><div class="window"></div>
    <div class="figure" aria-hidden="true"><div class="body"></div><div class="hair"></div><div class="face"></div><div class="bang"></div><div class="eye e1"></div><div class="eye e2"></div></div>
    <div class="tag" id="sceneTag">SEKOLAH • 19:42</div>
    <button class="hotspot desk" onclick="inspect('desk')">Meja tua</button>
    <button class="hotspot door" onclick="inspect('door')">Pintu</button>
  </section>
  <section class="panel">
    <div class="speaker" id="speaker">Narasi</div>
    <div class="story" id="story">Sekolah sudah sepi. Kamu datang untuk mengambil buku yang tertinggal, tapi dari ruang klub terdengar suara seseorang berdebat dengan… sesuatu yang menggeram.</div>
    <div class="choices" id="choices"></div>
  </section>
  <div class="tools">
    <button onclick="showHistory()">Riwayat dialog</button>
    <button onclick="saveGame()">Simpan progres</button>
    <button onclick="loadGame()">Muat progres</button>
    <button onclick="restart()">Ulangi</button>
  </div>
  <footer class="status"><span id="status">Petunjuk: 0 • Kedekatan: 0</span><span>Prototype 0.1</span></footer>
</main>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="modalbox"><h2 id="modalTitle">Info</h2><p id="modalText"></p><button onclick="closeModal()">Tutup</button></div>
</div>
<script>
const initial={scene:"start",affection:0,clues:0,inventory:[],history:[]};
let state={...initial,inventory:[],history:[]};
const storyData={
 start:{chapter:"PROLOG • 01",tag:"SEKOLAH • 19:42",speaker:"Narasi",text:"Sekolah sudah sepi. Kamu datang untuk mengambil buku yang tertinggal, tapi dari ruang klub terdengar suara seseorang berdebat dengan… sesuatu yang menggeram.",choices:[["Ketuk pintu dan tanya apakah semuanya baik-baik saja.","knock"],["Intip dari jendela kecil di pintu.","peek"]]},
 knock:{chapter:"PROLOG • 02",tag:"RUANG KLUB",speaker:"Mika",text:"Pintu terbuka. Mika, teman sekelasmu yang selalu sok berani, berdiri sambil memegang sapu. “Gw bisa jelasin. Tapi sebelum itu… lu percaya hantu nggak?”",choices:[["“Tergantung hantunya punya PR atau nggak.”","joke"],["“Mika, kenapa lu pegang sapu kayak pedang?”","ask"]]},
 peek:{chapter:"PROLOG • 02",tag:"JENDELA PINTU",speaker:"Narasi",text:"Kamu melihat Mika sedang bernegosiasi dengan boneka tua yang duduk sendiri di atas meja. Boneka itu menoleh tepat ke arahmu. Kamu yakin tadi matanya tertutup.",choices:[["Masuk dan bantu Mika.","help"],["Mundur pelan-pelan tanpa suara.","retreat"]]},
 joke:{chapter:"BAB 1 • 01",tag:"RUANG KLUB",speaker:"Mika",text:"Mika menatapmu datar. “Kalau hantunya ngumpulin PR, kelas kita udah jadi alam baka.” Ia tertawa, lalu suara ketukan terdengar dari dalam lemari.",choices:[["Buka lemari bersama Mika.","closet"],["Periksa meja untuk mencari petunjuk.","deskRoute"]]},
 ask:{chapter:"BAB 1 • 01",tag:"RUANG KLUB",speaker:"Mika",text:"“Ini bukan pedang. Ini alat negosiasi.” Mika menunjuk boneka di meja. “Dia minta dibukakan pintu, padahal kita nggak punya kunci.”",choices:[["Tanya boneka itu apa yang diinginkannya.","talkDoll"],["Cari kunci di sekitar ruangan.","deskRoute"]]},
 help:{chapter:"BAB 1 • 01",tag:"RUANG KLUB",speaker:"Mika",text:"Mika kelihatan lega saat kamu masuk. “Oke, partner. Boneka ini baru ngomong kalau kita menemukan sesuatu yang hilang.” Boneka itu mengangkat satu jari kayunya ke arah meja.",choices:[["Periksa meja.","deskRoute"],["Tanya Mika kenapa dia sendirian di sini.","askMika"]]},
 retreat:{chapter:"CABANG • 01",tag:"KORIDOR",speaker:"Narasi",text:"Kamu mundur. Lalu boneka itu terdengar berbisik dari balik pintu: “Kamu lupa sesuatu.” Di lantai, ada secarik kertas yang tadi belum ada.",choices:[["Ambil kertas itu.","paper"],["Lari ke gerbang sekolah.","run"]]},
 closet:{chapter:"BAB 1 • 02",tag:"LEMARI TUA",speaker:"Narasi",text:"Pintu lemari berderit. Tidak ada monster—hanya payung basah, kotak musik, dan bau tanah setelah hujan. Kotak musik itu memainkan tiga nada berulang.",choices:[["Catat urutan nada sebagai petunjuk.","music"],["Tutup lemari dan tanya Mika soal boneka.","talkDoll"]]},
 deskRoute:{chapter:"BAB 1 • 02",tag:"MEJA TUA",speaker:"Narasi",text:"Di bawah meja, kamu menemukan secarik catatan: “Kunci ada di tempat yang selalu menunjukkan wajahmu, tapi tak pernah menyimpan wajahmu.”",choices:[["Cari benda yang bisa menunjukkan wajah.","mirror"],["Tunjukkan catatan itu kepada Mika.","showNote"]]},
 talkDoll:{chapter:"BAB 1 • 02",tag:"BONEKA TUA",speaker:"Boneka",text:"Kepala boneka berputar sedikit. “Kembalikan namaku.” Mika berbisik, “Boneka punya nama? Gw bahkan lupa nama ikan cupang gw.”",choices:[["Periksa bagian belakang boneka.","dollBack"],["Cari catatan tentang boneka.","deskRoute"]]},
 askMika:{chapter:"BAB 1 • 02",tag:"RUANG KLUB",speaker:"Mika",text:"Mika menggaruk pipi. “Gw dengar suara dari ruang klub dan pengen buktiin gw nggak penakut. Sekarang gw berharap gw penakut.” Ia melirikmu, sedikit tersenyum.",choices:[["“Tenang, kita hadapi bareng.”","bond"],["“Strategi bagus. Nilai keberanian: minus sepuluh.”","jokeAgain"]]},
 paper:{chapter:"CABANG • 02",tag:"KERTAS MISTERIUS",speaker:"Narasi",text:"Kertas itu bertuliskan nama Mika dan sebuah simbol bulan. Tinta di bawahnya perlahan membentuk kalimat: “Jangan biarkan dia sendirian saat lonceng berbunyi.”",choices:[["Kembali ke ruang klub.","help"],["Simpan kertas lalu pulang mencari bantuan besok.","endingSafe"]]},
 run:{chapter:"ENDING • 01",tag:"ENDING: KABUR",speaker:"Narasi",text:"Kamu memilih keselamatan dan lari sampai gerbang. Besoknya, Mika mengirim pesan: “Lu nggak bakal percaya apa yang terjadi.” Mungkin petualanganmu baru saja tertunda.",choices:[["Main lagi dari awal.","restart"]]},
 music:{chapter:"PETUNJUK • 01",tag:"KOTAK MUSIK",speaker:"Narasi",text:"Kamu mengingat tiga nada itu. Catatan petunjuk masuk ke ingatanmu. Mika berbisik, “Kalau kita selamat, gw mau beli kotak musik yang nggak berhantu.”",choices:[["Lanjut cari petunjuk lain.","deskRoute"],["Coba ingat simbol di boneka.","dollBack"]]},
 mirror:{chapter:"PUZZLE • 01",tag:"CERMIN RETAK",speaker:"Narasi",text:"Cermin di dekat lemari memantulkan ruangan, tetapi bayanganmu terlambat bergerak satu detik. Di belakang bingkai ada kunci kecil dengan simbol bulan.",choices:[["Ambil kunci dan kembali ke boneka.","keyFound"],["Panggil Mika untuk melihat cermin.","bond"]]},
 showNote:{chapter:"BAB 1 • 03",tag:"CATATAN",speaker:"Mika",text:"“Cermin! Tentu aja. Petunjuk horor klasik.” Mika mencoba terlihat pintar, lalu menabrak kursi. Kamu nggak bisa menahan tawa.",choices:[["Ajak Mika memeriksa cermin.","mirror"],["Godain Mika soal kursi.","jokeAgain"]]},
 dollBack:{chapter:"PETUNJUK • 02",tag:"BAGIAN BELAKANG BONEKA",speaker:"Narasi",text:"Di punggung boneka terukir nama “Luna” dan simbol bulan. Saat kamu menyebut nama itu, boneka berhenti bergerak. Mika menatapmu dengan kagum.",choices:[["Sebut nama Luna sekali lagi.","nameLuna"],["Cari kunci dengan simbol bulan.","mirror"]]},
 bond:{chapter:"BAB 1 • 03",tag:"RUANG KLUB",speaker:"Mika",text:"“Makasih,” kata Mika pelan. Untuk sesaat, suasana terasa hangat—sampai sapu di tangannya jatuh sendiri. “Oke, itu bukan gw.”",choices:[["Tetap di sisi Mika dan periksa ruangan.","deskRoute"],["Bercanda untuk menenangkan suasana.","jokeAgain"]]},
 jokeAgain:{chapter:"BAB 1 • 03",tag:"KOMEDI DARURAT",speaker:"Mika",text:"“Lucu banget. Nanti kalau kita dihantui, gw rekomendasiin lu jadi badut pengusir setan.” Mika tertawa meski jelas masih takut.",choices:[["Lanjut investigasi bersama.","deskRoute"],["Tanya apakah Mika baik-baik saja.","bond"]]},
 keyFound:{chapter:"PUZZLE • 02",tag:"KUNCI BULAN",speaker:"Narasi",text:"Kunci itu pas dengan lubang kecil di alas boneka. Saat diputar, terdengar bunyi klik dan selembar kertas jatuh. Di atasnya tertulis: “Terima kasih sudah mengingatku.”",choices:[["Bacakan pesan itu kepada Mika.","nameLuna"],["Simpan pesan dan periksa pintu.","doorPuzzle"]]},
 nameLuna:{chapter:"BAB 1 • 04",tag:"NAMA YANG HILANG",speaker:"Boneka",text:"“Luna…” bisikmu. Boneka itu menunduk. Lampu berkedip sekali, lalu suasana hening. Mika merapat ke sampingmu. “Oke, ternyata kita tim pemecah masalah paranormal.”",choices:[["Temani Mika sampai semua aman.","endingWarm"],["Tanya Luna kenapa ia muncul malam ini.","endingMystery"]]},
 doorPuzzle:{chapter:"PUZZLE • 03",tag:"PINTU TERKUNCI",speaker:"Narasi",text:"Di balik pintu terdengar bunyi lonceng tiga kali. Kunci bulan terasa hangat di tanganmu. Kamu bisa membuka pintu sekarang, atau kembali memastikan Mika siap.",choices:[["Buka pintu bersama Mika.","endingMystery"],["Pastikan Mika siap dulu.","endingWarm"]]},
 endingSafe:{chapter:"ENDING • 02",tag:"ENDING: BESOK SAJA",speaker:"Narasi",text:"Kamu menyimpan petunjuk dan memilih mencari bantuan esok hari. Kamu aman malam ini, tetapi misteri Luna dan Mika masih menunggu. Kadang, menunda pilihan juga mengubah cerita.",choices:[["Main lagi dari awal.","restart"]]},
 endingWarm:{chapter:"ENDING • 03",tag:"ENDING: PARTNER",speaker:"Mika",text:"Kamu dan Mika tetap bersama sampai sekolah kembali sunyi. “Kalau besok gw bilang ini semua mimpi, ingetin gw kalau gw punya partner paling bisa diandalkan.” Mika tersenyum malu. ENDING: PARTNER.",choices:[["Main lagi untuk mencari ending lain.","restart"]]},
 endingMystery:{chapter:"ENDING • 04",tag:"ENDING: DI BALIK PINTU",speaker:"Narasi",text:"Pintu terbuka ke ruangan yang tidak tercatat di denah sekolah. Dari dalam, seseorang memanggil nama Mika. Mika menggenggam lenganmu. “Kita masuk bareng, kan?” Jawabanmu akan menentukan bab berikutnya. ENDING: MISTERI.",choices:[["Main lagi untuk mencari ending lain.","restart"]]}
};
function updateStatus(){document.getElementById("status").textContent="Petunjuk: "+state.clues+" • Kedekatan: "+state.affection}
function render(id){if(id==="restart"){restart();return}const s=storyData[id]||storyData.start;state.scene=id;document.getElementById("chapter").textContent=s.chapter;document.getElementById("sceneTag").textContent=s.tag;document.getElementById("speaker").textContent=s.speaker;document.getElementById("story").textContent=s.text;const c=document.getElementById("choices");c.innerHTML="";s.choices.forEach((ch,i)=>{const b=document.createElement("button");const n=document.createElement("span");n.className="choiceNo";n.textContent=String(i+1).padStart(2,"0");const t=document.createElement("span");t.textContent=ch[0];b.append(n,t);b.onclick=()=>choose(ch[1],ch[0]);c.appendChild(b)});state.history.push(s.speaker+": "+s.text);updateStatus()}
function choose(id,label){if(id==="bond")state.affection++;if(id==="music"||id==="paper"||id==="keyFound")state.clues++;if(id==="restart"){restart();return}render(id)}
function inspect(what){if(what==="desk"){if(!state.inventory.includes("catatan")){state.inventory.push("catatan");state.clues++;showModal("Meja tua","Kamu menemukan catatan kecil: “Kunci ada di tempat yang selalu menunjukkan wajahmu, tapi tak pernah menyimpan wajahmu.” Catatan ditambahkan sebagai petunjuk. Temukan cermin di sekitar ruangan.");updateStatus()}else showModal("Meja tua","Kamu sudah memeriksa meja ini. Catatan itu mungkin berguna untuk memecahkan misteri.")}else{showModal("Pintu ruang klub","Pintunya berderit pelan. Kamu mendengar suara lonceng dari baliknya. Mungkin sebaiknya kamu berbicara dengan Mika dulu.")}}
function showModal(title,text){document.getElementById("modalTitle").textContent=title;document.getElementById("modalText").textContent=text;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function showHistory(){const lines=state.history.slice(-8);showModal("Riwayat dialog",lines.length?lines.join("\n\n"):"Belum ada riwayat.")}
function saveGame(){try{localStorage.setItem("moonlightSave",JSON.stringify(state));showModal("Progres disimpan","Progres disimpan di penyimpanan browser pada perangkat ini. Kalau data browser dihapus atau ganti browser, penyimpanan lokal bisa hilang.")}catch(e){showModal("Gagal menyimpan","Browser tidak mengizinkan penyimpanan lokal saat ini.")}}
function loadGame(){try{const raw=localStorage.getItem("moonlightSave");if(!raw){showModal("Belum ada save","Mainkan sedikit dulu, lalu tekan Simpan progres.");return}state=JSON.parse(raw);state.inventory=state.inventory||[];state.history=state.history||[];render(state.scene||"start");showModal("Progres dimuat","Save terakhir berhasil dimuat di browser ini.")}catch(e){showModal("Gagal memuat","Save tidak bisa dibaca.")}}
function restart(){state={...initial,inventory:[],history:[]};render("start")}
render("start");
</script>
</body>
</html>
